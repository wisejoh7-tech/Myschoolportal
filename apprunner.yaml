# AWS App Runner Service Configuration Manifest
# Can be used with AWS CLI or AWS App Runner GitHub integration
version: 1.0
runtime: nodejs20
build:
  commands:
    build:
      - npm ci
      - npm run build
run:
  command: npm run server
  network:
    port: 5000
    env: APP_PORT
  env:
    - name: NODE_ENV
      value: production
    - name: PORT
      value: "5000"
    - name: CORS_ORIGIN
      value: "*"
