services:
  # ⚙️ BACKEND WEB SERVICE (Node.js / Express API + Socket.io Server)
  - type: web
    name: uniportal-backend
    runtime: docker
    plan: free
    rootDir: .
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: uniportal-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        fromService:
          type: static
          name: uniportal-frontend
          property: url

  # 💻 FRONTEND STATIC SITE (React 19 + Vite Frontend App)
  - type: static
    name: uniportal-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: uniportal-backend
          property: url
      - key: VITE_SOCKET_URL
        fromService:
          type: web
          name: uniportal-backend
          property: url

databases:
  # 🐘 POSTGRESQL DATABASE
  - name: uniportal-db
    databaseName: uniportal
    user: uniportal_user
    plan: free
